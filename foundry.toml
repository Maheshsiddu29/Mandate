# Foundry configuration for the Phase 6 execution gate (contracts/).
#
# Deterministic by construction: pinned compiler, pinned EVM target and a fixed
# fuzz seed, so a CI failure reproduces locally byte for byte. Deployment is
# never part of this configuration; see docs/execution-gate.md §13.

[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
cache_path = "contracts/cache"
libs = ["contracts/lib", "node_modules"]
remappings = [
    "forge-std/=contracts/lib/forge-std/src/",
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
]
solc_version = "0.8.37"
# OpenZeppelin 5.6 needs MCOPY. Arbitrum supports Cancun opcodes from ArbOS 20;
# confirming the target chain does is a deployment precondition (docs §13).
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
# OpenZeppelin 5.6 names an identifier `error`; that warning is theirs, not ours.
ignored_warnings_from = ["node_modules"]
# Reads only: the generated gate corpus ABI, deployment configs, and build artifacts (deployCodeTo).
fs_permissions = [
    { access = "read", path = "./contracts/generated" },
    { access = "read", path = "./contracts/deploy" },
    { access = "read", path = "./contracts/out" },
]

[profile.default.fuzz]
runs = 1024
seed = "0x6d616e64617465"

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false
failure_persist_dir = "contracts/cache/invariant"

[fmt]
line_length = 120

[lint]
# Lint the code that would be deployed. Test doubles deliberately do what lints
# forbid (the scripted adapter's raw transfers model a hostile adapter).
ignore = ["contracts/test/**/*.sol"]
